<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가람 체육활동 안내 사이트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Nav -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-600 p-2 rounded-xl shadow font-black text-xl">
                    <i class="fa-solid fa-flag"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">한가람 체육활동 안내</h1>
                    <p class="text-xs text-indigo-200">2026학년도 한가람 페스티벌</p>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 font-semibold text-sm">
                <a href="#intro" class="hover:text-indigo-200 transition">환영인사</a>
                <a href="#schedule" class="hover:text-indigo-200 transition">전체 일정</a>
                <a href="#zones" class="hover:text-indigo-200 transition">활동 구역</a>
                <a href="#board" class="hover:text-indigo-200 transition">응원 방명록</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-16 px-4 text-center relative overflow-hidden">
        <div class="max-w-4xl mx-auto relative z-10">
            <span class="bg-indigo-500 bg-opacity-60 text-indigo-100 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4 inline-block border border-indigo-400">
                <i class="fa-solid fa-bell mr-1"></i> 체육활동 안내서
            </span>
            <h2 class="text-3xl md:text-5xl font-black mb-6 leading-tight">
                함께 뛰고, 웃고, 하나 되는<br>한가람 체육 한마당!
            </h2>
            <p class="text-lg md:text-xl text-indigo-100 mb-8 max-w-2xl mx-auto font-light">
                안전하고 즐거운 체육활동을 위해 경기 일정과 장소별 규칙을 확인해 보세요.
            </p>
            <div class="flex justify-center gap-4">
                <a href="#schedule" class="bg-white text-indigo-700 font-bold px-6 py-3 rounded-xl shadow-lg hover:bg-indigo-50 transition transform hover:-translate-y-0.5">
                    <i class="fa-solid fa-calendar-days mr-2"></i> 경기 일정 보기
                </a>
                <a href="#zones" class="bg-indigo-700 bg-opacity-50 border border-indigo-400 text-white font-bold px-6 py-3 rounded-xl hover:bg-indigo-700 transition">
                    <i class="fa-solid fa-map-location-dot mr-2"></i> 구역별 안내
                </a>
            </div>
        </div>
        <!-- Background Bubble Effect -->
        <div class="absolute -bottom-10 -left-10 w-48 h-48 bg-indigo-500 rounded-full mix-blend-multiply filter blur-xl opacity-40 animate-pulse"></div>
        <div class="absolute -top-10 -right-10 w-48 h-48 bg-violet-500 rounded-full mix-blend-multiply filter blur-xl opacity-40 animate-pulse"></div>
    </section>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full space-y-16">

        <!-- Schedule Section -->
        <section id="schedule" class="scroll-mt-24">
            <div class="text-center mb-10">
                <h3 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2">오늘의 경기 일정</h3>
                <p class="text-slate-500">시간대별 세부 프로그램과 장소를 확인하세요.</p>
            </div>

            <div class="space-y-4 max-w-4xl mx-auto">
                <!-- Schedule Item 1 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items
